<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houdini DeadLite Manager</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-header: #2d2d30;
            --border-color: #3e3e42;
            --text-main: #d4d4d4;
            --text-muted: #858585;
            --accent-green: #4ade80;
            --row-alt: #252526;
            --row-hover: #2a2d2e;
            --row-selected-deadline: #22c55e;
            /* scrollbars and other browser-drawn parts match the dark theme */
            color-scheme: dark;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 4px 8px;
            gap: 8px;
            align-items: center;
        }
        
        .toolbar-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .toolbar-btn:hover {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .toolbar-btn:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            background: transparent;
            border: 1px solid transparent;
            opacity: 0.5;
        }
        .toolbar-separator {
            width: 1px;
            height: 20px;
            background-color: var(--border-color);
            margin: 0 4px;
        }

        .title-branding {
            margin-left: auto;
            font-weight: bold;
            color: var(--accent-green);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            /* On a narrow window the title gives way, the buttons stay on one line */
            white-space: nowrap;
            min-width: 0;
            overflow: hidden;
        }

        /* Grid Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            flex: 1;
            gap: 4px;
            padding: 4px;
            min-height: 0; /* needed for nested scrolling */
        }

        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel.workers-panel {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
        }

        .panel-header {
            background-color: var(--bg-header);
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .panel-content {
            flex: 1;
            overflow: auto;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        
        th, td {
            padding: 4px 8px;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        
        th {
            background-color: var(--bg-header);
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: normal;
            color: var(--text-muted);
            box-shadow: 0 1px 0 var(--border-color);
        }

        tbody tr:nth-child(even) {
            background-color: var(--row-alt);
        }

        tbody tr:hover {
            background-color: var(--row-hover);
            cursor: pointer;
        }

        tbody tr.selected {
            background-color: var(--row-selected-deadline);
            color: #000;
        }

        .status-queued { color: var(--text-main); }
        .status-running { color: #60a5fa; }
        .status-completed { color: var(--accent-green); }
        .status-failed { color: #f87171; }
        .status-paused { color: #fbbf24; }
        .status-cancelled { color: #f87171; }

        tr.selected .status-queued,
        tr.selected .status-running,
        tr.selected .status-completed,
        tr.selected .status-failed,
        tr.selected .status-paused,
        tr.selected .status-cancelled {
            color: #000;
            font-weight: bold;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            width: 80%;
            height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-header {
            padding: 8px 12px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
        }
        .close-btn:hover { color: white; }
        .modal-body {
            flex: 1;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        pre#log-content {
            flex: 1;
            margin: 0;
            padding: 12px;
            background: #000;
            color: #a3e635; /* Terminal green */
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Progress Bar CSS */
        .progress-cell {
            position: relative;
            min-width: 80px;
            padding: 0 !important; /* Remove padding so bar can fill cell */
        }
        .progress-bar-bg {
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-color: transparent;
            z-index: 0;
        }
        .progress-bar-fill {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            background-color: rgba(46, 204, 113, 0.4);
            z-index: 1;
            transition: width 0.3s ease;
        }
        .progress-text {
            position: relative;
            z-index: 2;
            padding: 4px 8px;
            text-align: center;
            font-weight: 600;
            display: block;
        }

        .job-pos {
            text-align: center;
            font-weight: bold;
            color: var(--accent-green);
        }
        tr.selected .job-pos { color: #000; }

        /* Buttons inside table rows (workers) */
        .row-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 1px 8px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
        }
        .row-btn:hover { background: rgba(255,255,255,0.1); }

        /* A .bat file is being dragged over the window */
        body.dropping .main-grid {
            outline: 2px dashed var(--accent-green);
            outline-offset: -6px;
        }
    </style>
</head>
<body>

    <!-- Hidden file input for submitting jobs -->
    <input type="file" id="file-input" style="display: none;" accept=".bat">

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="toolbar-btn" onclick="document.getElementById('file-input').click()">
            Submit Job
        </button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" id="btn-start" disabled onclick="jobAction('start')">Start</button>
        <button class="toolbar-btn" id="btn-pause" disabled onclick="jobAction('pause')">Pause</button>
        <button class="toolbar-btn" id="btn-cancel" disabled onclick="jobAction('cancel')">Cancel</button>
        <button class="toolbar-btn" id="btn-delete" disabled onclick="jobAction('delete')">Delete</button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" id="btn-move-up" disabled onclick="moveJob('up')">▲ Move Up</button>
        <button class="toolbar-btn" id="btn-move-down" disabled onclick="moveJob('down')">▼ Move Down</button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" id="btn-logs" disabled onclick="openSelectedTaskLog()">View Logs</button>
        <button class="toolbar-btn" id="btn-output" disabled onclick="openOutput()">Open Output</button>
        
        <div class="title-branding">
            Houdini DeadLite Manager
        </div>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">
        <!-- Jobs Panel -->
        <div class="panel jobs-panel">
            <div class="panel-header">
                <span>Jobs</span>
                <span id="jobs-count" style="color:var(--text-muted)">0 total</span>
            </div>
            <div class="panel-content">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">Pos</th>
                            <th>Job Name</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Done</th>
                            <th>Left</th>
                            <th>Time</th>
                            <th>Submitted</th>
                            <th>ID</th>
                        </tr>
                    </thead>
                    <tbody id="jobs-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tasks Panel -->
        <div class="panel tasks-panel">
            <div class="panel-header">
                <span>Tasks</span>
                <span id="tasks-count" style="color:var(--text-muted)">0 total</span>
            </div>
            <div class="panel-content">
                <table>
                    <thead>
                        <tr>
                            <th>Task ID</th>
                            <th>Frame</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Time</th>
                            <th>Worker</th>
                        </tr>
                    </thead>
                    <tbody id="tasks-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Workers Panel -->
        <div class="panel workers-panel">
            <div class="panel-header">
                <span>Workers</span>
                <span id="workers-count" style="color:var(--text-muted)">0 total</span>
            </div>
            <div class="panel-content">
                <table>
                    <thead>
                        <tr>
                            <th>Worker Name</th>
                            <th>Status</th>
                            <th>Houdini</th>
                            <th>Last Update</th>
                            <th style="width: 80px;"></th>
                        </tr>
                    </thead>
                    <tbody id="workers-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Log Modal -->
    <div class="modal-overlay" id="log-modal">
        <div class="modal">
            <div class="modal-header">
                <span id="log-modal-title">Task Logs</span>
                <button class="close-btn" onclick="closeLogModal()">×</button>
            </div>
            <div class="modal-body">
                <pre id="log-content">Loading...</pre>
            </div>
        </div>
    </div>

    <script>
        let globalState = { tasks: {}, jobs: {}, workers: {}, job_order: [] };
        let selectedJobId = null;
        let selectedTaskId = null;
        let activeLogTaskId = null;
        let logOffset = null;      // how much of the open task's log has been fetched
        let logBusy = false;

        const jobsTbody = document.getElementById('jobs-tbody');
        const tasksTbody = document.getElementById('tasks-tbody');
        const workersTbody = document.getElementById('workers-tbody');

        // Names come from file names and machine names: never trust them as HTML
        function esc(text) {
            return String(text).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        }

        // --- File Upload Logic ---
        async function uploadBat(file) {
            if (!file.name.toLowerCase().endsWith('.bat')) {
                alert(`${file.name} is not a .bat file`);
                return;
            }
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/jobs/upload', {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    fetchState();
                } else {
                    const err = await res.json();
                    alert(`Upload failed: ${err.error || 'unknown error'}`);
                }
            } catch (err) {
                console.error(err);
                alert('Upload error');
            }
        }

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            await uploadBat(file);
            // Reset input
            e.target.value = '';
        });

        // .bat files can also be dropped anywhere on the dashboard
        let dragDepth = 0;
        window.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragDepth++;
            document.body.classList.add('dropping');
        });
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('dragleave', () => {
            dragDepth = Math.max(0, dragDepth - 1);
            if (!dragDepth) document.body.classList.remove('dropping');
        });
        window.addEventListener('drop', async (e) => {
            e.preventDefault();
            dragDepth = 0;
            document.body.classList.remove('dropping');
            for (const file of e.dataTransfer.files) {
                await uploadBat(file);
            }
        });

        // --- Polling & Rendering Logic ---
        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                globalState = await res.json();

                // If a job is selected but it was deleted (e.g. from another tab or just now), clear selection
                if (selectedJobId && !globalState.jobs[selectedJobId]) {
                    selectedJobId = null;
                    selectedTaskId = null;
                }
                renderState();
                fetchLog();
            } catch (err) {
                console.error("Failed to fetch state:", err);
            }
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const d = new Date(timestamp * 1000);
            return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        }

        function formatDurationSecs(diffSecs) {
            if (diffSecs <= 0) return '-';
            const h = Math.floor(diffSecs / 3600);
            const m = Math.floor((diffSecs % 3600) / 60);
            const s = Math.floor(diffSecs % 60);
            if (h > 0) return `${h}h ${m}m ${s}s`;
            if (m > 0) return `${m}m ${s}s`;
            return `${s}s`;
        }

        function taskSeconds(t) {
            if (!t.start_time) return 0;
            const end = t.end_time || (Date.now() / 1000);
            return Math.max(0, end - t.start_time);
        }

        // Frames a task covers. A job from Houdini carries them; for a .bat they are read from the command.
        function taskFrames(t) {
            if (t.frames && t.frames.length) {
                const first = t.frames[0];
                const last = t.frames[t.frames.length - 1];
                return first === last ? `${first}` : `${first}-${last}`;
            }
            let fMatch = t.command.match(/-f\s+([0-9.]+)\s+([0-9.]+)/) || t.command.match(/-f\s+([0-9.]+)\s+-n\s+([0-9.]+)/);
            if (!fMatch) return 'N/A';
            // handle both format variations from previous iterations
            if (t.command.includes('-n')) {
                const start = parseFloat(fMatch[1]);
                const num = parseFloat(fMatch[2]);
                return `${start}-${start + num - 1}`;
            }
            return `${fMatch[1]}-${fMatch[2]}`;
        }

        // How far a job is, counted in frames when the job knows its frames and in tasks otherwise,
        // and a rough estimate of the time left from how long the finished part took.
        function jobProgress(jobTasks) {
            const inFrames = jobTasks.some(t => t.frames && t.frames.length);
            let done = 0, total = 0;
            // For the estimate: work rendered so far and the time it took, work still to do, machines on it
            let rendered = 0, seconds = 0, remaining = 0, rendering = 0;
            for (const t of jobTasks) {
                const size = inFrames ? t.frames.length : 1;
                const finished = t.status === 'completed' ? size : (inFrames ? (t.done_frames || []).length : 0);
                total += size;
                done += finished;

                if (t.status === 'completed') {
                    rendered += size;
                    seconds += taskSeconds(t);
                } else if (t.status === 'running') {
                    // Without frame-by-frame information the progress bar still tells how far it is
                    const partly = Math.max(finished, size * (t.progress || 0) / 100);
                    rendered += partly;
                    seconds += taskSeconds(t);
                    remaining += size - partly;
                    rendering++;
                } else if (t.status === 'queued') {
                    remaining += size - finished;
                }
            }

            let left = '';
            if (rendering && remaining > 0 && rendered > 0) {
                left = '~' + formatDurationSecs((seconds / rendered) * remaining / rendering);
            }
            return { text: `${done}/${total} ${inFrames ? 'frames' : 'tasks'}`, left: left };
        }

        // Table rows are kept, and only the cells whose content changed are touched.
        // Rebuilding the tables on every refresh used to swallow clicks that landed mid-rebuild.
        function syncRows(tbody, rows) {
            const existing = new Map();
            for (const tr of tbody.children) existing.set(tr.dataset.id, tr);

            let previous = null;
            for (const row of rows) {
                let tr = existing.get(row.id);
                if (tr) {
                    existing.delete(row.id);
                } else {
                    tr = document.createElement('tr');
                    tr.dataset.id = row.id;
                    for (let i = 0; i < row.cells.length; i++) tr.appendChild(document.createElement('td'));
                }
                if (tr.className !== row.className) tr.className = row.className;
                row.cells.forEach((cell, i) => updateCell(tr.children[i], cell));

                const shouldFollow = previous ? previous.nextSibling : tbody.firstChild;
                if (tr !== shouldFollow) tbody.insertBefore(tr, shouldFollow);
                previous = tr;
            }
            for (const tr of existing.values()) tr.remove();
        }

        // A cell is either {html, className} or {progress}
        function updateCell(td, cell) {
            if (cell.progress !== undefined) {
                const p = Math.max(0, Math.min(100, cell.progress || 0));
                if (!td.firstChild) {
                    td.innerHTML = `
                        <div class="progress-cell">
                            <div class="progress-bar-bg"></div>
                            <div class="progress-bar-fill"></div>
                            <span class="progress-text"></span>
                        </div>
                    `;
                }
                if (td.shown !== p) {
                    td.querySelector('.progress-bar-fill').style.width = `${p}%`;
                    td.querySelector('.progress-text').textContent = `${p}%`;
                    td.shown = p;
                }
                return;
            }
            if (td.shown !== cell.html) {
                td.innerHTML = cell.html;
                td.shown = cell.html;
            }
            const className = cell.className || '';
            if (td.className !== className) td.className = className;
        }

        function renderState() {
            const tasksByJob = {};
            for (const t of Object.values(globalState.tasks)) {
                (tasksByJob[t.job_id] = tasksByJob[t.job_id] || []).push(t);
            }

            // Render Jobs in queue order
            const jobs = [];
            for (const job_id of globalState.job_order || []) {
                if (globalState.jobs[job_id]) {
                    jobs.push(globalState.jobs[job_id]);
                }
            }
            document.getElementById('jobs-count').innerText = `${jobs.length} total`;

            syncRows(jobsTbody, jobs.map((job, i) => {
                const jobTasks = tasksByJob[job.id] || [];

                // Calculate job progress and total time
                let totalProgress = 0;
                let jobTime = 0;
                for (const t of jobTasks) {
                    totalProgress += (t.progress || 0);
                    jobTime += taskSeconds(t);
                }
                const avgProgress = jobTasks.length ? Math.floor(totalProgress / jobTasks.length) : 0;
                const progress = jobProgress(jobTasks);

                // A job keeps rendering its other tasks after one fails, so show failures next to the status
                const failedCount = jobTasks.filter(t => t.status === 'failed').length;
                const failedNote = (failedCount && job.status !== 'failed') ? ` <span class="status-failed">(${failedCount} failed)</span>` : '';
                const warningCount = jobTasks.filter(t => t.warning).length;
                const warningNote = warningCount ? ` <span class="status-paused">(${warningCount} with warnings)</span>` : '';
                // Queued with no machine able to take it: say what it is waiting for
                const waitingNote = job.waiting_for ? ` <span class="status-paused">- waiting for ${esc(job.waiting_for)}</span>` : '';

                return {
                    id: job.id,
                    className: job.id === selectedJobId ? 'selected' : '',
                    cells: [
                        { html: `#${i + 1}`, className: 'job-pos' },
                        { html: esc(job.name) },
                        { html: `${job.status}${failedNote}${warningNote}${waitingNote}`, className: `status-${job.status}` },
                        { progress: avgProgress },
                        { html: progress.text },
                        { html: progress.left || '-' },
                        { html: formatDurationSecs(jobTime) },
                        { html: formatTime(job.created_at) },
                        { html: job.id.substring(0, 8) }
                    ]
                };
            }));

            // Render Tasks (for selected job)
            const job = selectedJobId && globalState.jobs[selectedJobId];
            // same order as the submitted file, which is the order they are handed out
            const tasks = job ? (tasksByJob[job.id] || []).sort((a, b) => a.index - b.index) : [];
            // For a job from Houdini, say how it renders next to the count
            const jobInfo = (job && job.type) ? `${job.type} · Houdini ${esc(job.houdini)} · ` : '';
            document.getElementById('tasks-count').innerText = `${jobInfo}${tasks.length} total`;

            syncRows(tasksTbody, tasks.map((t, i) => {
                // Frames already on disk are skipped if the task is started again
                const doneCount = (t.done_frames || []).length;
                const doneNote = (doneCount && t.status !== 'completed') ? ` (${doneCount}/${t.frames.length} done)` : '';
                const tryNote = t.attempt > 1 ? ` (try ${t.attempt})` : '';
                const warningNote = t.warning ? ` <span class="status-paused">- ${esc(t.warning)}</span>` : '';

                return {
                    id: t.id,
                    className: t.id === selectedTaskId ? 'selected' : '',
                    cells: [
                        { html: `${i}` },
                        { html: `${taskFrames(t)}${doneNote}` },
                        { html: `${t.status}${tryNote}${warningNote}`, className: `status-${t.status}` },
                        { progress: t.progress || 0 },
                        { html: formatDurationSecs(taskSeconds(t)) },
                        { html: esc(t.worker_id || '-') }
                    ]
                };
            }));

            // Render Workers
            const workers = Object.values(globalState.workers);
            document.getElementById('workers-count').innerText = `${workers.length} total`;

            syncRows(workersTbody, workers.map(w => {
                // The manager decides who is online, so this does not depend on the browser's clock
                let status = 'Idle';
                let statusColor = 'status-completed';
                let action = 'disable';
                let actionLabel = 'Disable';
                if (w.status === 'offline') {
                    status = 'Offline';
                    statusColor = 'status-failed';
                    action = 'remove';
                    actionLabel = 'Remove';
                } else if (w.outdated) {
                    status = 'Outdated - update this worker to the same version as the manager';
                    statusColor = 'status-paused';
                } else if (!w.enabled) {
                    // Switched off here on the dashboard: it finishes what it is doing and takes nothing new
                    status = w.status === 'running' ? 'Rendering its last task, then disabled' : 'Disabled';
                    statusColor = 'status-paused';
                    action = 'enable';
                    actionLabel = 'Enable';
                } else if (w.status === 'running') {
                    status = 'Rendering';
                    statusColor = 'status-running';
                }

                return {
                    id: w.id,
                    className: '',
                    cells: [
                        { html: esc(w.id) },
                        { html: status, className: statusColor },
                        { html: esc((w.houdini || []).join(', ') || '-') },
                        { html: formatTime(w.last_seen) },
                        { html: `<button class="row-btn" data-action="${action}">${actionLabel}</button>` }
                    ]
                };
            }));

            updateToolbar();
        }

        // One listener per table instead of one per row: rows come and go
        jobsTbody.addEventListener('click', (e) => {
            const tr = e.target.closest('tr');
            if (tr) selectJob(tr.dataset.id);
        });
        tasksTbody.addEventListener('click', (e) => {
            const tr = e.target.closest('tr');
            if (tr) selectTask(tr.dataset.id);
        });
        tasksTbody.addEventListener('dblclick', (e) => {
            const tr = e.target.closest('tr');
            if (tr) openLogModal(tr.dataset.id);
        });
        workersTbody.addEventListener('click', (e) => {
            const button = e.target.closest('button[data-action]');
            if (button) workerAction(button.closest('tr').dataset.id, button.dataset.action);
        });

        function selectJob(jobId) {
            selectedJobId = jobId;
            selectedTaskId = null; // reset task selection
            renderState();
        }

        function selectTask(taskId) {
            selectedTaskId = taskId;
            renderState();
        }

        function updateToolbar() {
            const btnStart = document.getElementById('btn-start');
            const btnPause = document.getElementById('btn-pause');
            const btnCancel = document.getElementById('btn-cancel');
            const btnDelete = document.getElementById('btn-delete');
            const btnMoveUp = document.getElementById('btn-move-up');
            const btnMoveDown = document.getElementById('btn-move-down');
            const btnLogs = document.getElementById('btn-logs');
            const btnOutput = document.getElementById('btn-output');

            // Reset all to disabled
            btnStart.disabled = true;
            btnPause.disabled = true;
            btnCancel.disabled = true;
            btnDelete.disabled = true;
            btnMoveUp.disabled = true;
            btnMoveDown.disabled = true;
            btnLogs.disabled = true;
            // Jobs from Houdini know where their frames go
            btnOutput.disabled = !(selectedJobId && globalState.jobs[selectedJobId] && globalState.jobs[selectedJobId].output_dir);

            // The buttons act on the selected task if there is one, otherwise on the selected job. Say which.
            let target = '';
            if (selectedTaskId && globalState.tasks[selectedTaskId]) {
                target = ' Task';
            } else if (selectedJobId && globalState.jobs[selectedJobId]) {
                target = ' Job';
            }
            btnStart.textContent = 'Start' + target;
            btnPause.textContent = 'Pause' + target;
            btnCancel.textContent = 'Cancel' + target;

            if (selectedTaskId && globalState.tasks[selectedTaskId]) {
                // Task is selected, toolbar actions apply to the task
                const task = globalState.tasks[selectedTaskId];
                btnLogs.disabled = false;

                if (['paused', 'failed', 'cancelled', 'completed'].includes(task.status)) {
                    btnStart.disabled = false;
                }
                if (['queued'].includes(task.status)) {
                    btnPause.disabled = false;
                }
                if (['queued', 'running', 'paused'].includes(task.status)) {
                    btnCancel.disabled = false;
                }
            } else if (selectedJobId && globalState.jobs[selectedJobId]) {
                // Job is selected, toolbar actions apply to the job.
                // Each button is enabled when at least one task would be affected by it.
                const statuses = Object.values(globalState.tasks)
                    .filter(t => t.job_id === selectedJobId)
                    .map(t => t.status);
                const anyTask = (wanted) => statuses.some(s => wanted.includes(s));
                btnDelete.disabled = false;

                if (anyTask(['paused', 'failed', 'cancelled'])) {
                    btnStart.disabled = false;
                }
                if (anyTask(['queued'])) {
                    btnPause.disabled = false;
                }
                if (anyTask(['queued', 'running', 'paused'])) {
                    btnCancel.disabled = false;
                }

                // Enable Up/Down queue buttons
                const jobOrder = globalState.job_order || [];
                const idx = jobOrder.indexOf(selectedJobId);
                if (idx > 0) {
                    btnMoveUp.disabled = false;
                }
                if (idx !== -1 && idx < jobOrder.length - 1) {
                    btnMoveDown.disabled = false;
                }
            }
        }

        async function jobAction(action) {
            let targetId = null;
            let targetType = null;

            if (selectedTaskId) {
                targetId = selectedTaskId;
                targetType = 'tasks';
            } else if (selectedJobId) {
                targetId = selectedJobId;
                targetType = 'jobs';
            } else {
                return;
            }

            if (action === 'delete') {
                if (targetType === 'tasks') return; // Cannot delete tasks individually
                if (!confirm('Are you sure you want to permanently delete this job?')) return;
            }
            if (action === 'cancel') {
                if (!confirm(`Are you sure you want to cancel this ${targetType === 'tasks' ? 'task' : 'job'}?`)) return;
            }
            if (action === 'start' && targetType === 'tasks' && globalState.tasks[targetId]?.status === 'completed') {
                if (!confirm('This task already completed. Render it again?')) return;
            }

            try {
                await fetch(`/api/${targetType}/${targetId}/${action}`, { method: action === 'delete' ? 'DELETE' : 'POST' });
                if (action === 'delete') {
                    selectedJobId = null;
                    selectedTaskId = null;
                }
                fetchState();
            } catch (err) {
                console.error(err);
                alert(`Failed to ${action} ${targetType}`);
            }
        }

        // Enable or disable a machine, or drop one that is gone from the list
        async function workerAction(workerId, action) {
            try {
                if (action === 'remove') {
                    await fetch(`/api/workers/${encodeURIComponent(workerId)}`, { method: 'DELETE' });
                } else {
                    await fetch(`/api/workers/${encodeURIComponent(workerId)}/${action}`, { method: 'POST' });
                }
                fetchState();
            } catch (err) {
                console.error(err);
                alert(`Failed to ${action} ${workerId}`);
            }
        }

        // Opens the folder in Explorer on the machine the manager runs on
        async function openOutput() {
            if (!selectedJobId) return;
            try {
                const res = await fetch(`/api/jobs/${selectedJobId}/open-output`, { method: 'POST' });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.error || 'Could not open the output folder');
                }
            } catch (err) {
                console.error(err);
                alert('Could not open the output folder');
            }
        }

        async function moveJob(direction) {
            if (!selectedJobId) return;
            try {
                const res = await fetch(`/api/jobs/${selectedJobId}/move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ direction: direction })
                });
                if (res.ok) {
                    fetchState();
                } else {
                    const err = await res.json();
                    alert(`Failed to move job: ${err.error || 'Unknown error'}`);
                }
            } catch (err) {
                console.error(err);
                alert("Error moving job.");
            }
        }

        // --- Log window ---
        // Logs live in files on the manager. Only the log that is open is fetched,
        // and after the first look only the part that was added since.
        const NO_LOG_YET = 'No logs available yet.';

        function openLogModal(taskId) {
            const task = globalState.tasks[taskId];
            if (!task) return;
            activeLogTaskId = taskId;
            logOffset = null;
            document.getElementById('log-modal-title').innerText = 'Logs - ' + taskFrames(task);
            document.getElementById('log-content').textContent = 'Loading...';
            document.getElementById('log-modal').style.display = 'flex';
            fetchLog();
        }

        async function fetchLog() {
            const taskId = activeLogTaskId;
            if (!taskId || logBusy) return;
            logBusy = true;
            try {
                const query = logOffset === null ? '' : `?offset=${logOffset}`;
                const res = await fetch(`/api/tasks/${taskId}/log${query}`);
                if (taskId !== activeLogTaskId) return; // closed, or another log opened, while we waited

                const logContent = document.getElementById('log-content');
                if (!res.ok) {
                    logContent.textContent = 'This task no longer exists.';
                    return;
                }
                const log = await res.json();
                const isNearBottom = logContent.scrollHeight - logContent.scrollTop <= logContent.clientHeight + 50;
                const firstLook = logOffset === null;
                // The task was started again and its log began afresh
                const startedAgain = !firstLook && log.offset < logOffset;

                if (firstLook || startedAgain || logContent.textContent === NO_LOG_YET) {
                    const skipped = log.offset > 0 ? '[... earlier output not shown ...]\n' : '';
                    logContent.textContent = (skipped + log.text) || NO_LOG_YET;
                } else if (log.text) {
                    logContent.appendChild(document.createTextNode(log.text));
                }
                logOffset = log.size;

                if (firstLook || isNearBottom) {
                    logContent.scrollTop = logContent.scrollHeight;
                }
            } catch (err) {
                console.error("Failed to fetch log:", err);
            } finally {
                logBusy = false;
            }
        }

        function openSelectedTaskLog() {
            if (!selectedTaskId) return;
            openLogModal(selectedTaskId);
        }

        function closeLogModal() {
            activeLogTaskId = null;
            document.getElementById('log-modal').style.display = 'none';
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('log-modal');
            if (event.target == modal) {
                closeLogModal();
            }
        }

        // Start polling every 2 seconds
        setInterval(fetchState, 2000);
        fetchState();
    </script>
</body>
</html>
